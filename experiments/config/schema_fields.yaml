workflow:
  categories:
    identifiers:
      - workflow_id
      - campaign_id
      - parent_workflow_id
      - adapter_id
      - interceptor_ids
      - name
      - subtype
      - environment_id
    provenance_data:
      - used
      - generated
    configuration_metadata:
      - conf
      - flowcept_settings
      - flowcept_version
      - custom_metadata
      - extra_metadata
      - code_repository
    timing:
      - utc_timestamp
    user_and_system_context:
      - user
      - machine_info
      - sys_name
      - node_name
      - hostname
      - public_ip
      - private_ip
  required:
    - workflow_id
    - campaign_id
  optional:
    - parent_workflow_id
    - name
    - custom_metadata
    - used
    - generated
    - conf
    - flowcept_settings
    - flowcept_version
    - utc_timestamp
