task:
  categories:
    identifiers:
      - type
      - subtype
      - task_id
      - workflow_id
      - workflow_name
      - campaign_id
      - activity_id
      - group_id
      - parent_task_id
      - agent_id
      - source_agent_id
      - adapter_id
      - environment_id
    timing:
      - utc_timestamp
      - submitted_at
      - started_at
      - ended_at
      - registered_at
    provenance_data:
      - used
      - generated
      - dependencies
      - dependents
    execution_metadata:
      - status
      - stdout
      - stderr
      - data
      - custom_metadata
      - tags
    user_and_system_context:
      - user
      - login_name
      - node_name
      - hostname
      - public_ip
      - private_ip
      - address
      - mq_host
    telemetry_data:
      - telemetry_at_start
      - telemetry_at_end
    telemetry_data.cpu:
      - telemetry_at_start.cpu
      - telemetry_at_end.cpu
      - telemetry_at_start.cpu.times_avg
      - telemetry_at_end.cpu.times_avg
      - telemetry_at_start.cpu.percent_all
      - telemetry_at_end.cpu.percent_all
      - telemetry_at_start.cpu.frequency
      - telemetry_at_end.cpu.frequency
      - telemetry_at_start.cpu.times_per_cpu
      - telemetry_at_end.cpu.times_per_cpu
      - telemetry_at_start.cpu.percent_per_cpu
      - telemetry_at_end.cpu.percent_per_cpu
    telemetry_data.process:
      - telemetry_at_start.process
      - telemetry_at_end.process
      - telemetry_at_start.process.pid
      - telemetry_at_end.process.pid
      - telemetry_at_start.process.cpu_number
      - telemetry_at_end.process.cpu_number
      - telemetry_at_start.process.memory
      - telemetry_at_end.process.memory
      - telemetry_at_start.process.memory_percent
      - telemetry_at_end.process.memory_percent
      - telemetry_at_start.process.cpu_times
      - telemetry_at_end.process.cpu_times
      - telemetry_at_start.process.cpu_percent
      - telemetry_at_end.process.cpu_percent
      - telemetry_at_start.process.io_counters
      - telemetry_at_end.process.io_counters
      - telemetry_at_start.process.num_connections
      - telemetry_at_end.process.num_connections
      - telemetry_at_start.process.num_open_files
      - telemetry_at_end.process.num_open_files
      - telemetry_at_start.process.num_open_file_descriptors
      - telemetry_at_end.process.num_open_file_descriptors
      - telemetry_at_start.process.num_threads
      - telemetry_at_end.process.num_threads
      - telemetry_at_start.process.num_ctx_switches
      - telemetry_at_end.process.num_ctx_switches
      - telemetry_at_start.process.executable
      - telemetry_at_end.process.executable
      - telemetry_at_start.process.cmd_line
      - telemetry_at_end.process.cmd_line
    telemetry_data.memory:
      - telemetry_at_start.memory
      - telemetry_at_end.memory
      - telemetry_at_start.memory.virtual
      - telemetry_at_end.memory.virtual
      - telemetry_at_start.memory.swap
      - telemetry_at_end.memory.swap
    telemetry_data.disk:
      - telemetry_at_start.disk
      - telemetry_at_end.disk
      - telemetry_at_start.disk.disk_usage
      - telemetry_at_end.disk.disk_usage
      - telemetry_at_start.disk.io
      - telemetry_at_end.disk.io
      - telemetry_at_start.disk.io_per_disk
      - telemetry_at_end.disk.io_per_disk
    telemetry_data.network:
      - telemetry_at_start.network
      - telemetry_at_end.network
      - telemetry_at_start.network.netio
      - telemetry_at_end.network.netio
      - telemetry_at_start.network.netio_per_interface
      - telemetry_at_end.network.netio_per_interface
    telemetry_data.gpu:
      - telemetry_at_start.gpu
      - telemetry_at_end.gpu
  required:
    - task_id
    - workflow_id
    - campaign_id
    - activity_id
    - status
    - started_at
    - ended_at
  optional:
    - used
    - generated
    - parent_task_id
    - dependencies
    - dependents
    - agent_id
    - source_agent_id
    - adapter_id
    - environment_id
    - hostname
    - node_name
    - user
    - login_name
    - stdout
    - stderr
    - data
    - custom_metadata
    - tags
    - telemetry_at_start
    - telemetry_at_end
    - telemetry_at_start.cpu
    - telemetry_at_end.cpu
    - telemetry_at_start.memory
    - telemetry_at_end.memory
    - telemetry_at_start.process
    - telemetry_at_end.process
    - telemetry_at_start.disk
    - telemetry_at_end.disk
    - telemetry_at_start.network
    - telemetry_at_end.network
  not_applicable:
    - telemetry_at_start.gpu
    - telemetry_at_end.gpu

