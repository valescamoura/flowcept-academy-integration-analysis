defaults:
  runs: 30
  timeout_seconds: 300
  python: ".venv/bin/python"
  mongo:
    host: "localhost"
    port: 27017
    timeout_ms: 3000
    socket_timeout_ms: 10000
  flowcept:
    telemetry_capture:
      cpu: true
      per_cpu: true
      process_info: true
      mem: true
      disk: true
      network: true
      machine_info: true
      gpu: null

approaches:
  baseline:
    enabled: false
    description: "Academy Fibonacci workflow without Flowcept instrumentation."
    cwd: "approaches/baseline/src/fibonacci"
    python: "../../.venv/bin/python"
    command: ["{python}", "fibiterate7.py"]
    uses_flowcept: false
    mongo_db: "flowcept_baseline"
    env:
      PYTHONPATH: "/Users/valesca/Documents/projects/valescamoura/flowcept/src{pathsep}{repo_root}/experiments/shims/no_setproctitle{pathsep}{repo_root}"
      # Avoids macOS Objective-C fork-safety crashes when Parsl spawns Python workers.
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    setup:
      commands:
        - ["python3", "-m", "venv", "../../.venv"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "-U", "pip"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "parsl[monitoring]==2026.04.27"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "git+https://github.com/academy-agents/academy@1c9dd5bbe030e562101a30dd4dfa1b5b0dffff4d"]

  baseline_perceptron_gridsearch:
    enabled: false
    description: "Academy Perceptron GridSearch workflow without Flowcept instrumentation."
    cwd: "approaches/baseline/src/perceptron_gridsearch"
    python: "../../.venv/bin/python"
    command: ["{python}", "main.py"]
    uses_flowcept: false
    mongo_db: "flowcept_baseline_perceptron_gridsearch"
    artifacts:
      - "perceptron_gridsearch_summary.json"
      - "artifacts"
    env:
      PYTHONPATH: "{repo_root}"
      # Avoids macOS Objective-C fork-safety crashes when Parsl spawns Python workers.
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    setup:
      commands:
        - ["python3", "-m", "venv", "../../.venv"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "-U", "pip"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "numpy", "torch>=2.6.0"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "git+https://github.com/academy-agents/academy@1c9dd5bbe030e562101a30dd4dfa1b5b0dffff4d"]

  event_log_observability:
    enabled: true
    description: "Academy structured log events translated into Flowcept tasks."
    cwd: "approaches/event_log_observability/src/fibonacci"
    python: "../../.venv/bin/python"
    command: ["{python}", "fibiterate7.py"]
    uses_flowcept: true
    mongo_db: "flowcept_event_log_observability"
    flowcept:
      telemetry_capture:
        cpu: true
        per_cpu: true
        process_info: true
        mem: true
        disk: true
        network: true
        machine_info: true
        gpu: null
    env:
      PYTHONPATH: "{repo_root}/experiments/shims/no_setproctitle{pathsep}{repo_root}"
      # Avoids macOS Objective-C fork-safety crashes when Parsl spawns Python workers.
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    setup:
