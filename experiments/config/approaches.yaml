        - ["../../.venv/bin/python", "-m", "pip", "install", "numpy", "torch>=2.6.0"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "git+https://github.com/valescamoura/academy-flowcept"]
        - ["../../.venv/bin/python", "-m", "pip", "install", "git+https://github.com/academy-agents/academy@1c9dd5bbe030e562101a30dd4dfa1b5b0dffff4d"]

