notes:
- Generated mapping used by the current coverage scripts.
- Edit mapping.md, then rerun build_coverage_mapping.py.
- Synthetic subtype record-presence indicators are included as pseudo-fields.
- task.execution_metadata.stderr is conditional and does not count when no errored
  task has stderr.
provenance_data_categories:
  agentic: Information describing agent behavior and coordination, including participating
    agents, responsibilities, delegation relationships, interactions, communication
    patterns and LLM usage.
  domain-dataflow: Information directly related to the scientific or business problem
    being solved, including inputs, parameters, outputs, intermediate results, artifacts,
    and experiment metadata.
  hardware-usage: Information describing execution behavior and infrastructure state,
    including timing, resource consumption, hosts, nodes, runtime environments, and
    system metrics.
  workflow-control: Information describing workflow structure and execution history,
    including activities, task dependencies, execution order, and execution traces.
analytical_capabilities:
  dataflow-provenance: Data that enable tracing inputs, parameters, intermediate results,
    and outputs produced during execution.
  execution-traces: Data that enable reconstructing task/activity sequence, task hierarchy,
    dependencies, and execution paths.
  timing: Analyzes task duration, workflow duration, timing behavior, and execution
    delays.
  resource-usage: Analyzes CPU, memory, disk, network, and GPU usage.
  platform-and-repository-context: Examine hosts, nodes, runtime environments, platform
    context and system context.
  agentic: Identifies which human or AI agents participated, invoked actions, produced
    outputs, delegated work, or were responsible for failures.
