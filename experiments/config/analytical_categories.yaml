  fibonacci:
    domain_content_indicators:
      workflow.used:
        - init_a
        - init_b
        - limit
      workflow.generated: []
      task.used:
        - init_a
        - init_b
      task.generated:
        - done
        - value
        - b=
      task.custom_metadata:
        - init_a
        - init_b
        - done
        - value
        - b=
      task.data: []
      task.stdout: []
      task.stderr: []
      object.data: []
      object.custom_metadata: []
