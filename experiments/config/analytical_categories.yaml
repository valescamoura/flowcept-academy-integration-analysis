default_use_case: fibonacci

categories:
  provenance_information:
    label: "Provenance Information"
    question: "Can the strategy reconstruct the execution structure?"
    includes: "Workflows, tasks, agents, artifacts, dependencies, execution relationships, execution context."

  domain_information:
    label: "Domain Information"
    question: "Can the strategy recover parameters and scientific/domain data?"
    includes: "Parameters, prompts, scientific metadata, artifact contents, intermediate scientific results."

  telemetry_information:
    label: "Telemetry Information"
    question: "Can the strategy recover operational metrics?"
    includes: "CPU, memory, execution time, resource utilization."

schema_category_mapping:
  workflow:
    identifiers:
      - provenance_information
    provenance_data:
      - provenance_information
      - domain_information
    configuration_metadata:
      - provenance_information
    timing:
      - provenance_information
      - telemetry_information
    user_and_system_context:
      - provenance_information

  task:
    identifiers:
      - provenance_information
    timing:
      - provenance_information
      - telemetry_information
    provenance_data:
      - provenance_information
      - domain_information
    execution_metadata:
      - provenance_information
    user_and_system_context:
      - provenance_information
    telemetry_data:
      - telemetry_information
    telemetry_data.cpu:
      - telemetry_information
    telemetry_data.process:
      - telemetry_information
    telemetry_data.memory:
      - telemetry_information
    telemetry_data.disk:
      - telemetry_information
    telemetry_data.network:
      - telemetry_information
    telemetry_data.gpu:
      - telemetry_information

  object:
    identifiers:
      - provenance_information
    provenance_data:
      - provenance_information
      - domain_information
    artifact_fingerprint:
      - provenance_information
    storage_metadata:
      - provenance_information

